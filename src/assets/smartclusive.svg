<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" fill="none" role="img" aria-label="Smartclusive — ASL vocabulary learning platform">
  <defs>
    <linearGradient id="sc-bg" x1="0" y1="0" x2="1280" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f7f8f3"/>
      <stop offset="1" stop-color="#eef1e6"/>
    </linearGradient>
    <linearGradient id="sc-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fd11a"/>
      <stop offset="1" stop-color="#5f9a10"/>
    </linearGradient>
    <filter id="sc-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="30" flood-color="#1f2a10" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1280" height="800" fill="url(#sc-bg)"/>

  <!-- Top bar -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
    <circle cx="70" cy="66" r="16" fill="url(#sc-accent)"/>
    <text x="98" y="73" font-size="26" font-weight="700" fill="#17171a">Smartclusive</text>
    <text x="1210" y="73" font-size="20" font-weight="600" fill="#5f9a10" text-anchor="end">ASL · English</text>

    <!-- Camera panel -->
    <g filter="url(#sc-shadow)">
      <rect x="80" y="140" width="640" height="520" rx="24" fill="#0f130a"/>
      <rect x="80" y="140" width="640" height="520" rx="24" fill="#141a0d"/>
    </g>
    <!-- live dot -->
    <circle cx="120" cy="184" r="8" fill="#ff5a52"/>
    <text x="140" y="191" font-size="18" font-weight="600" fill="#e7f0d6">LIVE · webcam</text>

    <!-- Hand / sign glyph -->
    <g transform="translate(400,400)" fill="none" stroke="#bef264" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-70 60 L-70 -30 Q-70 -50 -50 -50 Q-30 -50 -30 -30 L-30 10"/>
      <path d="M-30 10 L-30 -70 Q-30 -90 -10 -90 Q10 -90 10 -70 L10 10"/>
      <path d="M10 10 L10 -80 Q10 -100 30 -100 Q50 -100 50 -80 L50 10"/>
      <path d="M50 10 L50 -60 Q50 -80 70 -80 Q90 -80 90 -60 L90 40 Q90 120 10 120 L-40 120 Q-70 120 -70 90"/>
    </g>
    <!-- hand tracking landmarks -->
    <g fill="#8fd11a">
      <circle cx="330" cy="460" r="6"/><circle cx="370" cy="330" r="6"/>
      <circle cx="410" cy="310" r="6"/><circle cx="450" cy="330" r="6"/>
      <circle cx="490" cy="360" r="6"/>
    </g>

    <!-- Right column: prompt + progress -->
    <g>
      <rect x="760" y="140" width="440" height="150" rx="20" fill="#ffffff" filter="url(#sc-shadow)"/>
      <text x="792" y="188" font-size="16" font-weight="600" fill="#9a9aa3" letter-spacing="2">TRANSLATE</text>
      <text x="792" y="236" font-size="34" font-weight="700" fill="#17171a">rumah</text>
      <text x="792" y="270" font-size="20" font-weight="500" fill="#5f9a10">→  h · o · u · s · e</text>
    </g>

    <!-- ASL letter tiles -->
    <g>
      <text x="760" y="342" font-size="16" font-weight="600" fill="#9a9aa3" letter-spacing="2">SIGN LETTER BY LETTER</text>
    </g>
    <g font-size="30" font-weight="700" text-anchor="middle">
      <rect x="760" y="360" width="82" height="82" rx="16" fill="url(#sc-accent)"/>
      <text x="801" y="411" fill="#ffffff">H</text>
      <rect x="854" y="360" width="82" height="82" rx="16" fill="url(#sc-accent)"/>
      <text x="895" y="411" fill="#ffffff">O</text>
      <rect x="948" y="360" width="82" height="82" rx="16" fill="url(#sc-accent)"/>
      <text x="989" y="411" fill="#ffffff">U</text>
      <rect x="1042" y="360" width="82" height="82" rx="16" fill="#ffffff" stroke="#d7ddc7" stroke-width="2"/>
      <text x="1083" y="411" fill="#17171a">S</text>
      <rect x="1136" y="360" width="82" height="82" rx="16" fill="#ffffff" stroke="#d7ddc7" stroke-width="2"/>
      <text x="1177" y="411" fill="#c3ccb2">E</text>
    </g>

    <!-- Mastery progress -->
    <g>
      <rect x="760" y="486" width="440" height="174" rx="20" fill="#ffffff" filter="url(#sc-shadow)"/>
      <text x="792" y="530" font-size="16" font-weight="600" fill="#9a9aa3" letter-spacing="2">WORD MASTERY</text>
      <rect x="792" y="552" width="376" height="16" rx="8" fill="#eef1e6"/>
      <rect x="792" y="552" width="248" height="16" rx="8" fill="url(#sc-accent)"/>
      <text x="792" y="612" font-size="26" font-weight="700" fill="#17171a">18 / 30 words</text>
      <text x="1168" y="612" font-size="22" font-weight="700" fill="#5f9a10" text-anchor="end">60%</text>
    </g>

    <text x="80" y="712" font-size="20" font-weight="500" fill="#5a5a63">Learn English vocabulary through American Sign Language — real-time webcam feedback.</text>
  </g>
</svg>
